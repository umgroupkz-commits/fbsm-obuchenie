<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FBSM — обучение</title>
<!--
  Обучалка FBSM. Собрана из боевой программы: оформление и оболочка взяты
  у неё же, чтобы человек учился на том виде, который увидит в работе.
  Файл собирается скриптом sborka.py — править его руками бесполезно,
  правки живут в obuchenie.js.

  Данные здесь выдуманные. Ни один клик не уходит на сервер: двадцать
  человек, тренирующихся в боевой базе, оставили бы там записи в зарплате
  и графике, и разбирать это пришлось бы руками.
-->
<style>

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f3;--surface:#fff;--s2:#f0eeea;
  --text:#1a1a1a;--muted:#6b6b68;--border:#e0ded8;
  --blue:#185FA5;--bl:#E6F1FB;--bd:#0C447C;
  --green:#3B6D11;--gl:#EAF3DE;
  --amber:#BA7517;--al:#FAEEDA;
  --red:#A32D2D;--rl:#FCEBEB;
  --r:10px;--rs:6px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
.screen{display:none;min-height:100vh}.screen.active{display:block}
.aw{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
.ac{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:2rem;width:100%;max-width:360px}
.brand{font-size:28px;font-weight:700;letter-spacing:2px;color:var(--bd);text-align:center}
.sub{font-size:13px;color:var(--muted);text-align:center;margin:4px 0 1.5rem}
.layout{display:flex;min-height:100vh}
.sb{width:220px;background:var(--bd);color:#fff;flex-shrink:0;display:flex;flex-direction:column}
.sb-logo{padding:1.25rem 1rem;font-size:18px;font-weight:700;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-user{padding:.75rem 1rem;font-size:12px;color:rgba(255,255,255,.6);border-bottom:1px solid rgba(255,255,255,.1)}
.sb-user strong{display:block;color:#fff;font-size:13px;margin-bottom:2px}
.ni{display:flex;align-items:center;gap:10px;padding:.75rem 1rem;font-size:14px;color:rgba(255,255,255,.75);cursor:pointer;border:none;background:none;width:100%;text-align:left;border-left:3px solid transparent}
.ni:hover{background:rgba(255,255,255,.08);color:#fff}
.ni.active{background:rgba(255,255,255,.12);color:#fff;border-left-color:#fff}
.sb-bot{margin-top:auto;padding:1rem;border-top:1px solid rgba(255,255,255,.1)}
.main{flex:1;overflow-y:auto}
.mh{background:var(--surface);border-bottom:1px solid var(--border);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
.mt{font-size:17px;font-weight:600}
.cnt{padding:1.5rem}
/* ══ ТЕЛЕФОН ══ см. блок в конце таблицы стилей ══ */
.mnav{display:none}
.msheet{display:none}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:1.25rem;margin-bottom:1rem}
.ct{font-size:15px;font-weight:600;margin-bottom:1rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}
/* Клетка сетки по умолчанию не уже своего содержимого: длинная плитка
   («Нужно в смену до конца месяца») распирала дашборд, и вся страница
   на телефоне ездила вбок. Разрешаем сжиматься — текст переносится. */
.g2>*,.g3>*,.g4>*{min-width:0}}
.metric{background:var(--s2);border-radius:var(--rs);padding:1rem;text-align:center}
.mv{font-size:20px;font-weight:700;margin-top:4px;line-height:1}
.ml{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.btn:hover{background:var(--s2)}.btn:disabled{opacity:.5;cursor:not-allowed}
.bp{background:var(--blue);color:#fff;border-color:var(--blue)}.bp:hover{background:var(--bd)}
.bd2{color:var(--red);border-color:var(--red)}.bd2:hover{background:var(--rl)}
.bg{background:var(--green);color:#fff;border-color:var(--green)}.bg:hover{opacity:.9}
.bsm{padding:5px 10px;font-size:12px}.bbl{width:100%;justify-content:center}
.fg{margin-bottom:.75rem}
.fl{font-size:13px;color:var(--muted);display:block;margin-bottom:4px;font-weight:500}
.fc{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--rs);background:var(--surface);color:var(--text);font-size:14px}
.fc:focus{outline:none;border-color:var(--blue)}
.fc-s{font-size:12.5px}
.fc-t{padding:4px 6px;font-size:12px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media(max-width:400px){.fr{grid-template-columns:1fr}}
.pb{background:var(--s2);border-radius:100px;height:8px;overflow:hidden;margin:6px 0}
.pf{height:100%;border-radius:100px;transition:width .5s}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600}
.ts{background:var(--gl);color:var(--green)}.tw{background:var(--al);color:var(--amber)}
.td{background:var(--rl);color:var(--red)}.ti{background:var(--bl);color:var(--bd)}
.tw-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--s2);padding:8px 10px;text-align:left;font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--s2)}
.alert{padding:10px 14px;border-radius:var(--rs);font-size:13px;margin-bottom:.75rem}
.as{background:var(--gl);color:var(--green)}.ae{background:var(--rl);color:var(--red)}.ai{background:var(--bl);color:var(--bd)}
.motiv{background:var(--bl);border:1px solid #B5D4F4;border-radius:var(--r);padding:1rem;margin-bottom:1rem;font-size:14px;color:var(--bd)}
.nav-g{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);
  padding:14px 12px 5px;font-weight:700;opacity:.75}
.nav-g:first-child{padding-top:4px}
.rclock{font-size:38px;font-weight:700;letter-spacing:-1px;text-align:center;margin:.4rem 0}
.rsince{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:1rem}
.rnote{font-size:11.5px;color:var(--muted);margin-top:.6rem}
.zpr{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--border);font-size:13px;color:var(--muted)}
.zpr:last-child{border:none;font-weight:600;color:var(--text);font-size:14px}
.rank{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:100px;font-size:12px;font-weight:600}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem}
.ovc{background:var(--surface);border-radius:var(--r);padding:1.5rem;width:100%;max-width:600px;max-height:90vh;overflow-y:auto}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loader{position:fixed;inset:0;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;z-index:999;gap:10px;font-size:14px;color:var(--muted)}
.print-only{display:none}
@media print{.sb,.mh,.btn,.nav-item{display:none!important}.print-only{display:block}.cnt{padding:0}}
/* ══ ГРАФИК СМЕН (модуль sch*) ══ */
/* Селекторы намеренно вида «.sch td.xxx»: базовое правило .sch td
   имеет специфичность (0,1,1) и перебивало бы одиночные классы. */
.sch-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
.sch{border-collapse:separate;border-spacing:0;font-size:12px;width:auto;min-width:100%}
.sch td,.sch th{padding:0;border:none}
.sch tbody tr:hover td{background:none}

.sch td.sch-name,.sch th.sch-name{position:sticky;left:0;z-index:2;background:var(--surface);
  min-width:200px;max-width:200px;padding:11px 16px;text-align:left;line-height:1.4;
  border-right:2px solid var(--border);border-bottom:1px solid var(--border)}
.sch thead th.sch-name{background:var(--s2);z-index:3;padding-top:9px;padding-bottom:9px}

.sch td.sch-day,.sch th.sch-day{width:38px;min-width:38px;
  border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.sch thead th.sch-day{background:var(--s2);padding:8px 0 7px;text-align:center}
.sch-dn{display:block;font-weight:700;font-size:11.5px;color:var(--text)}
.sch-dw{display:block;font-size:9.5px;color:var(--muted);margin-top:2px}
.sch td.sch-we{background:#faf8f4}
.sch thead th.sch-we{background:#eae2d6}
.sch thead th.sch-we .sch-dn{color:var(--amber)}
/* Сегодняшний столбец — выделен, чтобы на телефоне сразу найти «где я сейчас». */
.sch td.sch-today{background:var(--bl)}
.sch thead th.sch-today{background:#d9e8fb}
.sch td.sch-today,.sch th.sch-today{box-shadow:inset 2px 0 0 var(--blue),inset -2px 0 0 var(--blue)}
.sch thead th.sch-today .sch-dn{color:var(--bd)}

.sch td.sch-tot,.sch th.sch-tot{min-width:64px;text-align:center;background:var(--s2);
  font-weight:700;font-size:13px;border-bottom:1px solid var(--border);
  border-left:1px solid var(--border);padding:8px 6px}
.sch thead th.sch-tot{font-size:10.5px;color:var(--muted);letter-spacing:.4px;padding:9px 6px}

/* Клетка: цветная «плашка» с отступом от границ — это и даёт воздух */
.sch-cell{height:44px;padding:4px;display:flex;flex-direction:column;gap:3px;
  cursor:pointer;user-select:none}
.sch-cell.ro{cursor:default}
.sch-p{flex:1;display:flex;align-items:center;justify-content:center;border-radius:5px;
  font-weight:700;font-size:11px;line-height:1;letter-spacing:.2px;transition:box-shadow .12s}
.sch-cell:not(.ro):hover .sch-p{box-shadow:inset 0 0 0 2px var(--blue)}
.sch-cell:not(.ro):hover .sch-p:empty{background:var(--bl)}
.sch-f{height:4px;border-radius:2px;flex-shrink:0}
.sch-cell.extra .sch-p{box-shadow:inset 0 0 0 2px var(--blue);background:var(--bl)}
.sch-cell.noplan .sch-p{background:var(--s2);font-weight:600}
/* День отдан другому магазину: человек в этот день на подмене. */
.sch-cell.sch-away .sch-p{background:repeating-linear-gradient(45deg,
  var(--s2),var(--s2) 4px,var(--surface) 4px,var(--surface) 8px);
  color:var(--muted);font-weight:400}
/* Уголок на клетке — единственный признак того, что комментарий
   есть вообще: без него его никто не откроет. */
.sch-p{position:relative}
.sch-note-dot{position:absolute;top:1px;right:1px;width:0;height:0;
  border-top:6px solid rgba(0,0,0,.45);border-left:6px solid transparent}

.sch tbody tr.sch-sum td{background:var(--s2);font-weight:600;font-size:11.5px;text-align:center;
  color:var(--muted);border-bottom:1px solid var(--border);padding:9px 0}
.sch tbody tr.sch-sum td.sch-name{background:var(--s2);font-weight:600;color:var(--muted);text-align:left}
.sch tbody tr.sch-sum:first-of-type td{border-top:2px solid var(--border)}

.sch-legend{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:1.1rem;padding:0 2px;
  font-size:12px;color:var(--muted);align-items:center}
.sch-dot{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}

.sch-opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 1.25rem}
.sch-opt{padding:10px 14px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);
  color:var(--text);cursor:pointer;font-size:13px;font-weight:500;text-align:left}
.sch-opt:hover{background:var(--s2)}
.sch-opt.sel{border-color:var(--blue);background:var(--bl);color:var(--bd);font-weight:600}
@media(max-width:640px){
  .sch td.sch-name,.sch th.sch-name{min-width:126px;max-width:126px;padding:9px 9px;font-size:11.5px}
  .sch td.sch-day,.sch th.sch-day{width:34px;min-width:34px}
}

/* ══ ТЕЛЕФОН: переопределения — последними, иначе их перебьют ══ */
@media(max-width:640px){
  .sb{display:none}
  .layout{display:block}
  .main{overflow:visible}
  .mh{position:sticky;top:0;z-index:40;padding:.7rem 1rem}
  .mt{font-size:16px}
  /* снизу — место под панель, иначе она накроет последнюю кнопку */
  .cnt{padding:1rem 1rem calc(84px + env(safe-area-inset-bottom))}

  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:var(--bd);padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -2px 14px rgba(0,0,0,.2)}
  .mni{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:3px;padding:8px 1px 7px;min-height:58px;border:none;
    background:none;color:rgba(255,255,255,.72);cursor:pointer;
    border-top:3px solid transparent;-webkit-tap-highlight-color:transparent}
  .mni .i{font-size:19px;line-height:1}
  .mni .l{font-size:10px;line-height:1.1;font-weight:500;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mni.active{color:#fff;border-top-color:#fff;background:rgba(255,255,255,.1)}

  /* «Ещё» — лист снизу: до него дотягивается большой палец, в отличие
     от выпадающего меню из верхнего угла */
  .msheet{display:block;position:fixed;inset:0;z-index:130;visibility:hidden}
  .msheet.on{visibility:visible}
  .msheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
  .msheet-c{position:absolute;left:0;right:0;bottom:0;background:var(--surface);
    border-radius:16px 16px 0 0;max-height:84vh;overflow-y:auto;
    padding:8px 0 calc(14px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 24px rgba(0,0,0,.22)}
  .msheet-grip{width:38px;height:4px;border-radius:2px;background:var(--border);margin:2px auto 8px}
  .msheet-who{padding:2px 18px 10px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--border)}
  .msheet-who strong{display:block;color:var(--text);font-size:15px}
  .msheet .ni{color:var(--text);padding:13px 18px;font-size:15px;min-height:50px;
    border-left:3px solid transparent}
  .msheet .ni.active{background:var(--bl);color:var(--bd);border-left-color:var(--blue)}
  .msheet .nav-g{padding:13px 18px 3px}
  .msheet-bot{padding:10px 18px 0}

  /* Палец — не курсор: 44 px это его подушечка, меньше — промахи */
  .btn{min-height:44px;padding:11px 16px;font-size:14px}
  .bsm{min-height:42px;padding:10px 14px;font-size:13px}
  /* галочка в 13 px — цель для мыши, а не для пальца */
  input[type=checkbox],input[type=radio]{width:22px;height:22px;flex-shrink:0}
  /* 16 px — порог, ниже которого Safari при касании зумит всю страницу */
  .fc,input,select,textarea{font-size:16px}
  .fc{padding:12px 12px}
  .metric{padding:.85rem .5rem}
  .sch-opt{min-height:44px;padding:12px 14px;font-size:14px}
  th,td{padding:10px 8px}
  .cnt table{font-size:13.5px}

  /* Широкую таблицу листают вбок — пусть имя остаётся на виду */
  .tw-wrap tr{background:var(--surface)}
  .tw-wrap thead tr{background:var(--s2)}
  .tw-wrap th:first-child,.tw-wrap td:first-child{position:sticky;left:0;z-index:1;
    background:inherit;box-shadow:1px 0 0 var(--border)}
  .tw-wrap tr:hover td{background:inherit}

  /* Диалоги — снизу, как везде на телефоне */
  .ov{padding:0;align-items:flex-end}
  .ovc{border-radius:16px 16px 0 0;max-height:92vh;padding:1.25rem 1rem calc(1.25rem + env(safe-area-inset-bottom))}
}

/* На узком телефоне две колонки не помещаются: в карточке KPI живёт
   строка «поле + кнопка Рассчитать», она уже не сжимается, и весь
   дашборд уезжает вбок. Ниже 480 px раскладываем в одну колонку. */
@media(max-width:480px){
  .g2{grid-template-columns:1fr}
}

/* ── Тренер: плашки поверх интерфейса ──────────────────────────
   Тренер не заменяет интерфейс, а лежит поверх него: сверху объяснение,
   снизу задание. Человек всё время работает в настоящих экранах, а не
   смотрит на картинки рядом с текстом.

   Нижняя плашка на телефоне поднята над панелью разделов: иначе она
   накрывала бы её, и до половины программы было бы не дотянуться. */
.tr-verh{background:var(--blue,#185FA5);color:#fff;border-radius:var(--r,12px);
  padding:14px 16px;margin-bottom:1rem}
.tr-verh .tr-n{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  opacity:.75;margin-bottom:3px}
.tr-verh h3{margin:0 0 6px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.tr-verh p{margin:0 0 7px;font-size:14px;line-height:1.5;opacity:.95}
.tr-verh p:last-child{margin-bottom:0}
.tr-pb{height:5px;background:rgba(255,255,255,.25);border-radius:99px;
  overflow:hidden;margin-top:10px}
.tr-pb i{display:block;height:100%;background:#fff;transition:width .25s}

.tr-niz{position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:var(--card,#fff);border-top:2px solid var(--blue,#185FA5);
  padding:11px 14px calc(11px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 22px rgba(0,0,0,.13)}
.tr-niz .tr-in{max-width:1180px;margin:0 auto;display:flex;gap:12px;
  align-items:center;flex-wrap:wrap}
.tr-zad{flex:1 1 220px;font-size:14px;line-height:1.45}
.tr-zad b{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--blue,#185FA5);margin-bottom:2px}
.tr-ok{color:var(--green,#2f7a4f);font-weight:700}
@media(max-width:900px){ .tr-niz{bottom:56px} }

/* Подсветка того, на что надо нажать: обводка и мягкое биение.
   Без неё в настоящем экране человек не находит нужную кнопку. */
.tr-tyk{position:relative;outline:3px solid var(--blue,#185FA5)!important;
  outline-offset:2px;border-radius:8px;animation:trbit 1.5s ease-in-out infinite}
@keyframes trbit{0%,100%{outline-color:var(--blue,#185FA5)}
  50%{outline-color:rgba(24,95,165,.25)}}
@media(prefers-reduced-motion:reduce){ .tr-tyk{animation:none} }

/* Отступ снизу, чтобы нижняя плашка ничего не накрывала */
.cnt{padding-bottom:120px!important}
@media(max-width:900px){ .cnt{padding-bottom:190px!important} }

.tr-cert{max-width:100%;height:auto;border-radius:var(--r,12px);
  border:1px solid var(--bd,#dde3ea);display:block;margin:0 auto}

</style>
</head>
<body>



<div id="loader" class="loader"><div class="spin"></div> Загрузка...</div>

<div id="screen-login" class="screen">
  <div class="aw"><div class="ac">
    <div class="brand">FBSM</div>
    <div class="sub">Система учёта продаж</div>
    <div id="lerr" class="alert ae" style="display:none"></div>
    <div class="fg"><label class="fl">Выберите имя</label>
      <select id="lname" class="fc" autocomplete="username"
        onchange="var p=document.getElementById('lpass');if(this.value&&p)p.focus()"><option value="">— выберите —</option></select>
    </div>
    <div class="fg"><label class="fl">Пароль</label>
      <div style="position:relative">

window.doLogin = function(){
  // В режиме курса должность и пароль задаёт платформа — поля скрыты.
  const kursRol = window.__KURS_ROL && ROLE_LABELS[window.__KURS_ROL] ? window.__KURS_ROL : '';
  const rol = kursRol || document.getElementById('lname').value;
  const pass = kursRol ? '1234' : document.getElementById('lpass').value.trim();
  const err = document.getElementById('lerr');
  const imya = (document.getElementById('l-imya')||{}).value || '';
  err.style.display='none';
  if(!imya.trim()){ err.textContent='Напишите, как вас зовут — это попадёт в свидетельство'; err.style.display='block'; return; }
  if(!rol){ err.textContent='Выберите должность'; err.style.display='block'; return; }
  if(pass!=='1234'){ err.textContent='Пароль для обучения — 1234'; err.style.display='block'; return; }
  CU = {id:'me', name:imya.trim(), role:rol,
        shop: (rol==='admin'||rol==='accountant') ? null : (isClockRole(rol)?'Склад Пушкина':MAG)};
  document.getElementById('lpass').value='';
  setupSidebar(); showScreen('app');
  tr.start(rol);
};
window.doLogout = function(){
  if(!confirm('Выйти из обучения? Прогресс сохранится.')) return;
  mobSheet(false);
  document.querySelectorAll('.ov').forEach(o=>o.remove());
  CU=null; tr.stop(); showScreen('login');
};

const KEY = 'fbsm.obuch.v2';
const tr = {
  kurs:null, i:0, gotovo:false, rol:null,

  start(rol){
    this.rol = rol;
    this.kurs = KURSY[rol] || KURSY.seller;
    const d = this.chitat();
    this.i = (d && d.rol===rol) ? Math.min(d.i, this.kurs.length-1) : 0;
    this.shag();
  },
  stop(){ document.getElementById('trener').innerHTML=''; },

  chitat(){ try{ return JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ return null; } },
  pisat(){ try{ localStorage.setItem(KEY, JSON.stringify({rol:this.rol,i:this.i})); }catch(e){} },

  shag(){
    const s = this.kurs[this.i];
    this.gotovo = !s.cel;
    this.pisat();
    if(s.otkryt && window[s.otkryt]) window[s.otkryt]();
    this.risovat();
    // Подсветку ставим после отрисовки страницы: раньше её просто нечего подсвечивать.
    setTimeout(()=>this.podsvetit(), 60);
    window.scrollTo(0,0);
  },

  // Подсвечиваем ПЕРВОЕ, что нашлось на странице. Порядок в tyk такой:
  // сначала цель на нужном экране, потом пункт меню, которым до неё дойти.
  // Пока человек не перешёл, кнопки нет — светится меню; перешёл — светится
  // кнопка. Раньше подсветка ставилась один раз, и после перехода человек
  // искал нужное сам.
  podsvetit(){
    document.querySelectorAll('.tr-tyk').forEach(e=>e.classList.remove('tr-tyk'));
    const s = this.kurs[this.i];
    if(!s.tyk || this.gotovo) return;
    for(const sel of s.tyk.split(',')){
      const el = document.querySelector(sel.trim());
      if(el){ el.classList.add('tr-tyk'); return; }
    }
  },

  // Страницы и кнопки сообщают сюда, что человек сделал.
  sobytie(chto){
    const s = this.kurs && this.kurs[this.i];
    // Экран перерисовался — плашку сверху и подсветку ставим заново.
    if(chto.indexOf('page:')===0) setTimeout(()=>{ this.verh(); this.podsvetit(); }, 0);
    if(!s || this.gotovo || !s.cel) { return; }
    let popal = (s.cel === chto);
    // Цель вида act:smena:4 — «поставить столько-то»: сравниваем число.
    if(!popal && s.cel.startsWith('act:smena:') && chto.startsWith('act:smena:'))
      popal = (+chto.split(':')[2] >= +s.cel.split(':')[2]);
    if(!popal) return;
    this.gotovo = true;
    document.querySelectorAll('.tr-tyk').forEach(e=>e.classList.remove('tr-tyk'));
    this.niz();
  },

  dalee(){
    if(!this.gotovo) return;
    if(this.i+1 >= this.kurs.length){ this.finish(); return; }
    this.i++; this.shag();
  },
  nazad(){ if(this.i>0){ this.i--; this.shag(); } },

  risovat(){ this.verh(); this.niz(); },

  verh(){
    const s = this.kurs[this.i], n = this.kurs.length;
    const c = document.getElementById('content');
    if(!c) return;
    const old = c.querySelector('.tr-verh'); if(old) old.remove();
    const d = document.createElement('div');
    d.className = 'tr-verh';
    d.innerHTML = `<div class="tr-n">Шаг ${this.i+1} из ${n} · ${esc(ROLE_LABELS[this.rol])}</div>`
      + `<h3>${esc(s.t)}</h3>`
      + (s.txt||[]).map(p=>`<p>${esc(p)}</p>`).join('')
      + `<div class="tr-pb"><i style="width:${Math.round(this.i/n*100)}%"></i></div>`;
    c.insertBefore(d, c.firstChild);
  },

  niz(){
    const s = this.kurs[this.i], posl = (this.i+1 >= this.kurs.length);
    document.getElementById('trener').innerHTML = `
      <div class="tr-niz"><div class="tr-in">
        <div class="tr-zad"><b>Задание</b>
          ${this.gotovo ? '<span class="tr-ok">✓ Выполнено</span> — '+esc(s.zad||'') : esc(s.zad||'')}
        </div>
        ${this.i>0?'<button class="btn bsm" onclick="tr.nazad()">← Назад</button>':''}
        <button class="btn bp" onclick="tr.dalee()" ${this.gotovo?'':'disabled'}>
          ${posl?'Завершить':'Дальше →'}</button>
      </div></div>`;
  },

  finish(){
    document.getElementById('trener').innerHTML='';
    setTitle('Обучение пройдено'); setBadge('');
    const data = new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
    setContent(`
      <div class="card" style="max-width:720px"><div class="ct">🎓 Обучение пройдено</div>
        <p style="color:var(--muted)">Отправьте свидетельство руководителю — по нему
          засчитают аттестацию.</p>
        <canvas id="cert" class="tr-cert" width="1000" height="620"></canvas>
        <div class="codebox" id="uch-kod" style="font:600 18px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.04em;
          color:var(--blue,#185FA5);background:var(--bl,#e8f0fa);border:1px dashed var(--blue,#185FA5);
          border-radius:8px;padding:10px 14px;margin:1rem 0 0;text-align:center"></div>
        <button class="btn bp bbl" style="margin-top:1rem" onclick="uchOtpravit()">📲 Отправить в WhatsApp</button>
        <button class="btn bbl" style="margin-top:.6rem" onclick="uchSkachat()">⬇️ Сохранить картинку</button>
        <div class="rnote" id="uch-shint">На телефоне откроется выбор приложения —
          выберите WhatsApp и отправьте на +7 777 186 54 33.</div>
      </div>
      <div class="card" style="max-width:720px">
        <button class="btn bbl" onclick="tr.i=0;tr.shag()">Пройти заново</button>
      </div>`);
    cert(document.getElementById('cert'), CU.name, ROLE_LABELS[this.rol], data);
    const kod = uchKod(CU.name, this.rol, data);
    document.getElementById('uch-kod').textContent = kod;
    // Открыто из платформы обучения — она подставила обработчик и запишет
    // результат на портал. Открыто просто так — обработчика нет, остаётся картинка.
    if(typeof window.__onCourseDone === 'function'){
      try{ window.__onCourseDone({name:CU.name, right:this.kurs.length, total:this.kurs.length, code:kod, date:data}); }
      catch(e){ /* свидетельство всё равно показано */ }
    }
    try{ localStorage.removeItem(KEY); }catch(e){}
  },
};
window.tr = tr;

function uchKod(imya, rol, data){
  const s = String(imya||'').trim().toLowerCase()+'|'+rol+'|'+data;
  let a = 2166136261, b = 5381;
  for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i);
    a = Math.imul(a ^ c, 16777619) >>> 0; b = (Math.imul(b, 33) + c) >>> 0; }
  const z = '0123456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  const part = n => { let o=''; for(let i=0;i<5;i++){ o+=z[n%34]; n=Math.floor(n/34); } return o; };
  return 'FBSM-'+part(a)+'-'+part(b);
}
function cert(cv,imya,rol,data){
  const c=cv.getContext('2d'), W=cv.width;
  c.fillStyle='#0f2b4a'; c.fillRect(0,0,W,cv.height);
  c.strokeStyle='rgba(255,255,255,.18)'; c.lineWidth=2; c.strokeRect(28,28,W-56,cv.height-56);
  const cx=W/2; c.textAlign='center';
  c.fillStyle='#7fb4e8'; c.font='600 26px system-ui,sans-serif';
  c.fillText('FBSM · СИСТЕМА УЧЁТА ПРОДАЖ', cx, 96);
  c.fillStyle='#fff'; c.font='700 54px system-ui,sans-serif';
  c.fillText('Обучение пройдено', cx, 176);
  c.fillStyle='#9db9d6'; c.font='400 24px system-ui,sans-serif';
  c.fillText('подтверждаем, что программу освоил', cx, 232);
  let r=62; c.font='700 '+r+'px system-ui,sans-serif';
  while(c.measureText(imya).width > W-160 && r>26){ r-=3; c.font='700 '+r+'px system-ui,sans-serif'; }
  c.fillStyle='#fff'; c.fillText(imya, cx, 316);
  c.strokeStyle='#2f5f92'; c.lineWidth=3;
  c.beginPath(); c.moveTo(cx-190,344); c.lineTo(cx+190,344); c.stroke();
  c.fillStyle='#7fb4e8'; c.font='600 30px system-ui,sans-serif'; c.fillText(rol, cx, 396);
  c.fillStyle='#9db9d6'; c.font='400 22px system-ui,sans-serif'; c.fillText(data, cx, 452);
  c.font='400 19px system-ui,sans-serif'; c.fillStyle='#6f8dae';
  c.fillText('Все шаги курса выполнены, задания зачтены', cx, 520);
  c.fillText('Отправьте это изображение руководителю', cx, 552);
}
window.uchSkachat = function(){
  const a=document.createElement('a');
  a.download='FBSM-обучение-'+CU.name.replace(/\s+/g,'-')+'.png';
  a.href=document.getElementById('cert').toDataURL('image/png'); a.click();
};
// Картинку в WhatsApp отдаёт только системное «поделиться»: ссылка wa.me
// умеет нести лишь текст. На компьютере, где «поделиться» обычно нет,
// сохраняем файл и открываем переписку с готовой подписью.
window.uchOtpravit = async function(){
  const cv=document.getElementById('cert');
  const text='Обучение FBSM пройдено. '+CU.name+' — '+ROLE_LABELS[tr.rol]+'.';
  try{
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
    const file=new File([blob],'FBSM-обучение.png',{type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], text}); return;
    }
  }catch(e){}
  uchSkachat();
  const h=document.getElementById('uch-shint');
  if(h) h.textContent='Картинка сохранена. Сейчас откроется WhatsApp — прикрепите её вручную.';
  setTimeout(()=>window.open('https://wa.me/'+TEL_RUK+'?text='+encodeURIComponent(text),'_blank'),700);
};

// ══ ЗАПУСК ═══════════════════════════════════════════════════
(function(){
  const sel=document.getElementById('lname');
  sel.innerHTML='<option value="">— выберите должность —</option>'
    + ROLI.map(r=>`<option value="${r.id}">${r.nm}</option>`).join('');
  // Поле имени: в боевой его нет, здесь оно нужно для свидетельства.
  const fg=sel.closest('.fg');
  fg.insertAdjacentHTML('beforebegin',
    '<div class="fg"><label class="fl">Как вас зовут</label>'
    +'<input id="l-imya" class="fc" placeholder="Фамилия и имя"></div>');
  fg.querySelector('.fl').textContent='Ваша должность';
  document.querySelector('.ac .sub').textContent='Обучение · тренировка на выдуманных данных';
  document.getElementById('lpass').closest('.fg').insertAdjacentHTML('beforeend',
    '<div class="rnote">В боевой программе вы выбираете своё имя и вводите свой пароль. '
    +'Здесь вместо имени — должность, а пароль для всех один: <b>1234</b>.</div>');
  const l=document.getElementById('loader'); if(l) l.style.display='none';
  showScreen('login');
  const d=tr.chitat();
  if(d && d.rol) document.getElementById('lname').value=d.rol;
  // Режим курса: платформа обучения открывает тренажёр сразу на нужной должности.
  const KR = window.__KURS_ROL;
  if(KR && ROLE_LABELS[KR]){
    sel.value = KR; fg.style.display = 'none';
    document.getElementById('lpass').closest('.fg').style.display = 'none';
    document.querySelector('.ac .sub').textContent = 'Курс «'+ROLE_LABELS[KR]+'» · тренировка на выдуманных данных';
    if(window.__KURS_IMYA) document.getElementById('l-imya').value = window.__KURS_IMYA;
  }
})();

</script>
